[package]
name = "gax"
description = "Geometric algebra with extensors: typed multivectors, maps and forms, fused at compile time"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
keywords = ["geometric-algebra", "clifford", "pga", "extensor", "math"]
categories = ["mathematics", "graphics", "no-std"]
readme = "README.md"

[features]
default = ["std", "macros", "pga2d", "pga3d"]
## Every standard algebra.
all-algebras = ["pga2d", "pga3d", "vga2d", "vga3d", "sta", "cga3d", "stap", "csta"]
std = ["gax-core/std"]
pga2d = []
pga3d = []
vga2d = []
vga3d = []
sta = []
cga3d = []
## Projective spacetime algebra R(3,1,1) (not in the default set: larger to compile).
stap = []
## Conformal spacetime algebra R(4,2) (not in the default set: much larger to compile).
csta = []
## SIMD lane coefficients for batches in struct-of-arrays form.
wide = ["gax-core/wide"]
## Runtime-dispatched SIMD batch kernels (`gax::batch`) built on `fearless_simd`.
batch = ["std", "gax-core/batch", "gax-macros?/batch"]
## Build-time tracing of user kernels (`gax::trace`), for use from `build.rs`.
trace = ["dep:gax-gen"]
## The `algebra!` macro for declaring algebras of any signature.
macros = ["dep:gax-macros"]

[dependencies]
gax-core = { workspace = true }
gax-gen = { workspace = true, optional = true }
gax-macros = { workspace = true, optional = true }

[dev-dependencies]
gax-gen = { workspace = true }
proptest = "1"
trybuild = "1"

[lints]
workspace = true

[[example]]
name = "scene_graph"
required-features = ["pga3d"]

[[example]]
name = "rigid_body_modes"
required-features = ["pga2d"]

[[example]]
name = "cga_sta"
required-features = ["cga3d", "sta"]
