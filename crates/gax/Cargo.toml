[package]
name = "gax"
description = "Geometric algebra with extensors: typed multivectors, maps and forms, fused at compile time"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
keywords = ["geometric-algebra", "clifford", "pga", "extensor", "math"]
categories = ["mathematics", "graphics", "no-std"]
readme = "README.md"

[package.metadata.docs.rs]
# Every algebra and the optional modules; `deterministic` and `check-units` change behaviour, not the API.
features = ["all-algebras", "wide", "trace", "batch", "wgsl", "bytemuck"]

[features]
default = ["std", "macros", "pga2d", "pga3d"]
## Every standard algebra.
all-algebras = ["pga2d", "pga3d", "vga2d", "vga3d", "sta", "cga2d", "cga3d", "stap", "csta"]
std = ["gax-core/std"]
pga2d = []
pga3d = []
vga2d = []
vga3d = []
sta = []
cga2d = []
cga3d = []
## Projective spacetime algebra R(3,1,1) (not in the default set: larger to compile).
stap = []
## Conformal spacetime algebra R(4,2) (not in the default set: much larger to compile).
csta = []
## SIMD lane coefficients for batches in struct-of-arrays form.
wide = ["gax-core/wide"]
## Runtime-dispatched SIMD batch kernels (`gax::batch`) built on `fearless_simd`.
batch = ["std", "gax-core/batch", "gax-macros?/batch"]
## Debug check: assert that a `Unit` versor is unit (within √ε) whenever a certified kernel
## consumes it (sandwiches and prepared actions). No cost when off.
check-units = ["gax-macros?/check-units"]
## The same bits on every target and SIMD level (docs/numerics.md): no fused multiply-add, and
## the elementary functions from pure Rust.
deterministic = ["gax-core/deterministic"]
## Plain GPU layouts: a `{Kind}Gpu` type per kind (the layout of the WGSL modules) and
## `GpuMat`, all `bytemuck::Pod` (ADR-028).
bytemuck = ["gax-core/bytemuck", "gax-macros?/bytemuck"]
## The WGSL modules of the standard algebras as source strings (`gax::wgsl`, ADR-028), and
## of algebras declared with `algebra!` (their `WGSL_MODULE`).
wgsl = ["gax-macros?/wgsl"]
## Build-time tracing of user kernels (`gax::trace`), for use from `build.rs`.
trace = ["dep:gax-gen"]
## The `algebra!` macro for declaring algebras of any signature.
macros = ["dep:gax-macros"]

[dependencies]
gax-core = { workspace = true }
gax-gen = { workspace = true, optional = true }
gax-macros = { workspace = true, optional = true }

[dev-dependencies]
gax-gen = { workspace = true }
# Validates the generated WGSL modules (tests/wgsl.rs); never a runtime dependency.
naga = { version = "30", features = ["wgsl-in"] }
proptest = "1"
rand = "0.9"
trybuild = "1"

[lints]
workspace = true

[[example]]
name = "scene_graph"
required-features = ["pga3d"]

[[example]]
name = "rigid_body_modes"
required-features = ["pga2d"]

[[example]]
name = "cga_sta"
required-features = ["cga3d", "sta"]

[[example]]
name = "spacetime"
required-features = ["stap", "csta"]

[[example]]
name = "ik_chain"
required-features = ["pga3d"]

[[example]]
name = "batch_particles"
required-features = ["pga3d", "batch"]
