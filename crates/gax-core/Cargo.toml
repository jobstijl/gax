[package]
name = "gax-core"
description = "Core traits of gax: slots, kinds, coefficients and the small-matrix math core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = ["std"]
std = []
## SIMD lane coefficients (`f32x8`, `f64x4`, ...) from the `wide` crate.
wide = ["dep:wide"]
## Runtime-dispatched SIMD batch kernels (`gax::batch`), built on `fearless_simd`.
batch = ["std", "dep:fearless_simd"]
## The same results on every target and SIMD level: no fused multiply-add anywhere, and the
## elementary functions from pure Rust (`gax::math` for `f32`, `libm` for `f64`).
deterministic = []
## `bytemuck::Pod` for the GPU layouts (`GpuMat`, and the generated `{Kind}Gpu` types).
bytemuck = ["dep:bytemuck"]

[dependencies]
libm = "0.2"
bytemuck = { version = "1.25", optional = true, default-features = false }
wide = { version = "1.7", optional = true, default-features = false }
fearless_simd = { version = "1.0", optional = true, default-features = false, features = ["std"] }

[dev-dependencies]
proptest = "1"
# Doc examples use the generated standard algebras.
gax = { path = "../gax", default-features = false, features = ["std", "pga3d", "pga2d"] }

[lints]
workspace = true
