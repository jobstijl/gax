[package]
name = "gax-core"
description = "Core traits of gax: slots, kinds, coefficients and the small-matrix math core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = ["std"]
std = []
## SIMD lane coefficients (`f32x8`, `f64x4`, ...) from the `wide` crate.
wide = ["dep:wide"]

[dependencies]
libm = "0.2"
wide = { version = "1.7", optional = true, default-features = false }

[dev-dependencies]
proptest = "1"

[lints]
workspace = true
