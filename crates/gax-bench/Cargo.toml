[package]
name = "gax-bench"
description = "Benchmarks and assembly probes for gax (not published)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
gax = { path = "../gax", features = ["wide", "batch", "cga3d", "csta"] }
glam = "0.30"
ultraviolet = "0.10"
nalgebra = "0.34"

geometric_algebra = "0.3"

[build-dependencies]
gax = { path = "../gax", features = ["trace"] }

[dev-dependencies]
criterion = { version = "0.7", default-features = false, features = ["cargo_bench_support"] }

[[bench]]
name = "transform"
harness = false

[[bench]]
name = "compare"
harness = false

[[bench]]
name = "batch"
harness = false
