[package]
name = "gax-macros"
description = "The algebra! macro of gax: declare a geometric algebra of any signature"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
keywords = ["geometric-algebra", "clifford", "macro"]
categories = ["mathematics"]
readme = "README.md"

[lib]
proc-macro = true

[features]
## Emit the batch kernels (enabled by `gax/batch`).
batch = []
## Emit the `check-units` assertions (enabled by `gax/check-units`).
check-units = []
## Emit the GPU layout types (enabled by `gax/bytemuck`).
bytemuck = []
## Emit the algebra's WGSL modules, `WGSL_MODULE` and `WGSL_MODULE_F16` (enabled by `gax/wgsl`).
wgsl = []

[dependencies]
gax-gen = { workspace = true }

[lints]
workspace = true
