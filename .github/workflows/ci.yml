name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  test:
    name: test (${{ matrix.os }}, ${{ matrix.rust }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        rust: [stable, "1.89"]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
      - uses: Swatinem/rust-cache@v2
      # Compile-fail messages are pinned for the current stable compiler only.
      # On failure, the panic and error lines are repeated as annotations, which the GitHub API
      # shows without access to the logs.
      - name: test (default features)
        shell: bash
        run: |
          set -o pipefail
          # gax-wesl-tests needs the `wesl` crate, whose MSRV is above gax's.
          cargo test --no-fail-fast --workspace --exclude gax-bench ${{ matrix.rust == 'stable' && '' || '--exclude gax-wesl-tests' }} -- ${{ matrix.rust == 'stable' && '' || '--skip compile_fail' }} 2>&1 | tee test.log || {
            grep -E -A3 "panicked|^error|FAILED" test.log | head -40 | sed 's/^/::error::/'
            exit 1
          }
      - name: test (all algebras, SIMD, batch kernels on every level, WGSL modules)
        shell: bash
        run: |
          set -o pipefail
          cargo test --no-fail-fast -p gax -p gax-core --features gax/all-algebras,gax/wide,gax/batch,gax/wgsl,gax/bytemuck -- ${{ matrix.rust == 'stable' && '' || '--skip compile_fail' }} 2>&1 | tee test.log || {
            grep -E -A3 "panicked|^error|FAILED" test.log | head -40 | sed 's/^/::error::/'
            exit 1
          }
      - name: deterministic results across SIMD levels
        run: cargo test -p gax --features batch,deterministic --test determinism
      - name: certified kernels only see units (check-units)
        run: cargo test -p gax --features check-units -- --skip compile_fail
      - name: no_std build of the core
        run: cargo build -p gax-core --no-default-features

  laws:
    name: slow law proofs (--ignored)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: the ignored laws of every algebra
        shell: bash
        run: |
          set -o pipefail
          for f in crates/gax/tests/laws_*.rs; do
            t=$(basename "$f" .rs)
            cargo test -p gax --features all-algebras,macros --test "$t" -- --ignored 2>&1 | tee -a test.log || {
              grep -E -A3 "panicked|^error|FAILED|law failed" test.log | head -40 | sed 's/^/::error::/'
              exit 1
            }
          done

  asteroids:
    name: example game (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: examples/asteroids
      - run: cargo test
        working-directory: examples/asteroids
      - run: cargo build --release
        working-directory: examples/asteroids

  generated:
    name: generated algebras are up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo run --release -p gax-gen --bin gax-regen -- --check

  highdim:
    name: 7D, 8D and 9D algebras (the closed-form log, plain sandwiches, 7D WGSL)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/gax-highdim-tests
      # One algebra per test binary, two built at a time: each takes 2-4.5 GB to compile.
      - name: every feature (batch kernels, check-units, GPU layouts, WGSL modules)
        shell: bash
        working-directory: crates/gax-highdim-tests
        run: |
          set -o pipefail
          cargo test -j2 --no-fail-fast --features check-units,bytemuck,wgsl 2>&1 | tee test.log || {
            grep -E -A3 "panicked|^error|FAILED" test.log | head -40 | sed 's/^/::error::/'
            exit 1
          }

  gpu:
    name: WGSL kernels on a GPU (lavapipe)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/gax-gpu-tests
      - name: Mesa's software Vulkan driver
        run: sudo apt-get update && sudo apt-get install -y mesa-vulkan-drivers libvulkan1
      - name: every kernel, matrix orientation, layouts, traced kernels
        shell: bash
        working-directory: crates/gax-gpu-tests
        env:
          GAX_REQUIRE_GPU: "1"
          WGPU_BACKEND: vulkan
        run: |
          set -o pipefail
          cargo test -- --nocapture --test-threads 1 2>&1 | tee test.log || {
            grep -E -A3 "panicked|^error|FAILED" test.log | head -40 | sed 's/^/::error::/'
            exit 1
          }
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: examples/wgpu
      - name: the wgpu example, headless (GPU particles against their CPU twins)
        working-directory: examples/wgpu
        env:
          WGPU_BACKEND: vulkan
        run: cargo run --release -- --check

  warp:
    name: warp, the game (dependency contract, tests on lavapipe, smoke runs)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: examples/warp
      - name: system libraries, Mesa's software Vulkan, Xvfb
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev libxkbcommon-x11-0 mesa-vulkan-drivers libvulkan1 xvfb
      - name: dependency contract (Bevy is plumbing only)
        working-directory: examples/warp
        run: ./scripts/check-deps.sh
      - name: clippy (all math through gax)
        working-directory: examples/warp
        run: cargo clippy --release --all-targets -- -D warnings
      - name: tests (simulation, audio, CPU against GPU kernels)
        working-directory: examples/warp
        env:
          GAX_REQUIRE_GPU: "1"
          WGPU_BACKEND: vulkan
        shell: bash
        run: |
          set -o pipefail
          cargo test --release --no-fail-fast 2>&1 | tee test.log || {
            grep -E -A3 "panicked|^error|FAILED" test.log | head -40 | sed 's/^/::error::/'
            exit 1
          }
      - name: renderer smoke test (offscreen, wgpu validation on)
        working-directory: examples/warp
        env:
          WGPU_BACKEND: vulkan
        run: cargo run --release -- --shot shots 1
      - name: the app starts (Xvfb, no audio device)
        working-directory: examples/warp
        env:
          WGPU_BACKEND: vulkan
          WARP_NO_AUDIO: "1"
        shell: bash
        run: |
          set -o pipefail
          xvfb-run -a cargo run --release -- --smoke 2>&1 | tee smoke.log || {
            grep -E -A5 "panicked|ERROR|error" smoke.log | head -40 | sed 's/^/::error::/'
            exit 1
          }

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --features gax/all-algebras,gax/wide,gax/batch,gax/wgsl,gax/bytemuck
      - run: cargo doc --workspace --no-deps --features gax/all-algebras,gax/wide,gax/trace,gax/batch,gax/wgsl,gax/bytemuck
        env:
          RUSTDOCFLAGS: -D warnings

  bench:
    # Timings on shared runners are noisy, so this job never fails a build: it records a quick
    # criterion run of every benchmark for the trend (the artifact of each run on main). The
    # regressions that count are caught deterministically by the `generated` job: every
    # kernel's operation count is in docs/kernel-costs.md, regenerated and checked.
    name: benchmarks (quick, recorded, not gating)
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo bench -p gax-bench -- --quick --noplot 2>&1 | tee bench.txt
      - run: grep -B1 "time:" bench.txt | grep -v "^--" | tee -a "$GITHUB_STEP_SUMMARY" || true
      - uses: actions/upload-artifact@v4
        with:
          name: bench-${{ github.sha }}
          path: |
            bench.txt
            target/criterion

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2

  miri:
    name: miri (core)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri
      - run: cargo miri test -p gax-core --lib
        env:
          RUSTFLAGS: ""

  fuzz:
    name: fuzz the spec parser, the solvers and the tracer (short)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - run: cargo install cargo-fuzz --locked
      - run: cd fuzz && cargo fuzz run spec_parse -- -max_total_time=120 -max_len=512
        env:
          RUSTFLAGS: ""
      - run: cd fuzz && cargo fuzz run solve -- -max_total_time=120 -max_len=166
        env:
          RUSTFLAGS: ""
      - run: cd fuzz && cargo fuzz run trace_programs -- -max_total_time=180 -max_len=40
        env:
          RUSTFLAGS: ""
