name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  test:
    name: test (${{ matrix.os }}, ${{ matrix.rust }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        rust: [stable, "1.89"]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
      - uses: Swatinem/rust-cache@v2
      # Compile-fail messages are pinned for the current stable compiler only.
      # On failure, the panic and error lines are repeated as annotations, which the GitHub API
      # shows without access to the logs.
      - name: test (default features)
        shell: bash
        run: |
          set -o pipefail
          cargo test --no-fail-fast --workspace --exclude gax-bench -- ${{ matrix.rust == 'stable' && '' || '--skip compile_fail' }} 2>&1 | tee test.log || {
            grep -E -A3 "panicked|^error|FAILED" test.log | head -40 | sed 's/^/::error::/'
            exit 1
          }
      - name: test (all algebras, SIMD, batch kernels on every level)
        shell: bash
        run: |
          set -o pipefail
          cargo test --no-fail-fast -p gax -p gax-core --features gax/all-algebras,gax/wide,gax/batch -- ${{ matrix.rust == 'stable' && '' || '--skip compile_fail' }} 2>&1 | tee test.log || {
            grep -E -A3 "panicked|^error|FAILED" test.log | head -40 | sed 's/^/::error::/'
            exit 1
          }
      - name: deterministic results across SIMD levels
        run: cargo test -p gax --features batch,deterministic --test determinism
      - name: certified kernels only see units (check-units)
        run: cargo test -p gax --features check-units -- --skip compile_fail
      - name: no_std build of the core
        run: cargo build -p gax-core --no-default-features

  laws:
    name: slow law proofs (--ignored)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: the ignored laws of every algebra
        shell: bash
        run: |
          set -o pipefail
          for f in crates/gax/tests/laws_*.rs; do
            t=$(basename "$f" .rs)
            cargo test -p gax --features all-algebras,macros --test "$t" -- --ignored 2>&1 | tee -a test.log || {
              grep -E -A3 "panicked|^error|FAILED|law failed" test.log | head -40 | sed 's/^/::error::/'
              exit 1
            }
          done

  asteroids:
    name: example game (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: examples/asteroids
      - run: cargo test
        working-directory: examples/asteroids
      - run: cargo build --release
        working-directory: examples/asteroids

  generated:
    name: generated algebras are up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo run --release -p gax-gen --bin gax-regen -- --check

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --features gax/all-algebras,gax/wide,gax/batch
      - run: cargo doc --workspace --no-deps --features gax/all-algebras,gax/wide,gax/trace,gax/batch
        env:
          RUSTDOCFLAGS: -D warnings

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2

  miri:
    name: miri (core)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri
      - run: cargo miri test -p gax-core --lib
        env:
          RUSTFLAGS: ""

  fuzz:
    name: fuzz the spec parser (short)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - run: cargo install cargo-fuzz --locked
      - run: cd fuzz && cargo fuzz run spec_parse -- -max_total_time=120 -max_len=512
        env:
          RUSTFLAGS: ""
