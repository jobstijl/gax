[package]
name = "gax-colour"
description = "Colour as geometry, shared by the examples: colours as homogeneous PGA3D points in their spaces, after bevy_color"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "MIT OR Apache-2.0"
publish = false

# A standalone crate, used by path from the examples (warp, numga).
[workspace]

[dependencies]
gax = { path = "../../crates/gax", default-features = false, features = ["std", "pga3d"] }

[features]
## Conversions to and from gax's GPU layouts (`PointGpu`).
gpu = ["gax/bytemuck"]
