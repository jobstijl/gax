[package]
name = "gax-asteroids"
description = "A small Asteroids game on plane-based geometric algebra (gax PGA2D) and macroquad"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "MIT OR Apache-2.0"
publish = false

# A standalone crate, so that the game's windowing dependencies stay out of gax's workspace.
[workspace]

[dependencies]
gax = { path = "../../crates/gax", default-features = false, features = ["std", "pga2d", "batch"] }
macroquad = { version = "0.4", default-features = false }

rand = "0.9"
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
