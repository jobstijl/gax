[package]
name = "gax-example-traced"
description = "Build-time traced kernels: the same generic function, fused at build time"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
gax = { path = "../../crates/gax", features = ["batch"] }

[dev-dependencies]
gax = { path = "../../crates/gax", features = ["batch", "wgsl"] }
# The traced WGSL is linked against gax's modules and validated, as a game would use it.
wesl = "0.5"
naga = { version = "30", features = ["wgsl-in"] }

[build-dependencies]
gax = { path = "../../crates/gax", features = ["trace"] }
